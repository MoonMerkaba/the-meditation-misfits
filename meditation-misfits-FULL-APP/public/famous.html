<!doctype html><html><head><meta charset="utf-8"/><title>Famous – Meditation Misfits</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{brand:{pink:'#ff00bf'}}}}}</script><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-gray-900 text-white"><div id="root"></div><script type="text/babel">const {useState,useRef}=React;const BASE_URL="https://b68a5bcd6bdd8d5e08d002edc5589e48.r2.cloudflarestorage.com/soundicine/";const FREQ_FILES={alpha:["Classic-alpha-5-mins-(learning)-220-230.wav","Classic-alpha-10-mins-(learning)-220-230.wav"],theta:["Classic-theta-5-mins-(meditation)-220-230.wav","Classic-theta-10-mins-(meditation)-220-230.wav"],delta:["Classic-delta-5-mins-(sleep)-220-230.wav","Classic-delta-10-mins-(sleep)-220-230.wav"],beta:["Classic-beta-5-mins-(focus)-220-230.wav","Classic-beta-10-mins-(focus)-220-230.wav"],gamma:["Classic-gamma-5-mins-(insight)-220-230.wav"],heart:["Heart-639hz-5-mins-220-230.wav","Heart-639hz-10-mins-220-230.wav"],root:["Root-396hz-5-mins-220-230.wav"],schumann:["Schumann-7.83hz-5-mins-220-230.wav"],jupiter:["Jupiter-183hz-5-mins-220-230.wav"],venus:["Venus-221hz-5-mins-220-230.wav"]};function App(){const [tab,setTab]=useState("home");const [nudges,setNudges]=useState(false);const [senseScores,setSenseScores]=useState({sound:1,touch:1});return(<div><header className="p-4 bg-black/30"><div className="flex justify-between"><div className="flex gap-2"><div className="w-8 h-8 bg-brand-pink rounded"></div><span className="font-bold">Famous</span></div><nav className="flex gap-2">{["home","sensory","soundicine","shortcuts","profile"].map(t=><button key={t} onClick={()=>setTab(t)} className={`px-3 py-1 rounded ${tab===t?"bg-white text-black":"bg-gray-800"}`}>{t}</button>)}</nav></div></header><main className="p-4">{tab==="home"&&<Home setTab={setTab}/>}{tab==="sensory"&&<Sensory senseScores={senseScores} setSenseScores={setSenseScores}/>}{tab==="soundicine"&&<Soundicine/>}{tab==="shortcuts"&&<Shortcuts/>}{tab==="profile"&&<Profile nudges={nudges} setNudges={setNudges}/>}</main></div>);}function Home({setTab}){return(<div className="space-y-4"><h1 className="text-2xl">Welcome to Famous</h1><div className="grid grid-cols-2 gap-4"><div className="bg-gray-800 p-4 rounded cursor-pointer" onClick={()=>setTab("sensory")}><h3>Sensory Practice</h3><p>Adaptive meditation</p></div><div className="bg-gray-800 p-4 rounded cursor-pointer" onClick={()=>setTab("soundicine")}><h3>Sound-icine</h3><p>Frequency therapy</p></div></div></div>);}function Soundicine(){const [time,setTime]=useState("5m");const [aim,setAim]=useState("Calm");const [center,setCenter]=useState("Mind");const [result,setResult]=useState("");const [mode,setMode]=useState("simple");const [stackMain,setStackMain]=useState("alpha");const [stackSupport,setStackSupport]=useState("none");const [stackTime,setStackTime]=useState("10m");const [mainVol,setMainVol]=useState(0.7);const [supportVol,setSupportVol]=useState(0.3);const [isPlaying,setIsPlaying]=useState(false);const mainRef=useRef();const supportRef=useRef();const prescriptions={Calm:{freq:"alpha",desc:"Calming alpha waves"},Focus:{freq:"beta",desc:"Beta focus boost"},Sleep:{freq:"delta",desc:"Delta sleep induction"},Healing:{freq:"heart",desc:"Heart chakra 639Hz"}};function getFile(type,duration){const files=FREQ_FILES[type];if(!files)return null;const timeMap={"5m":0,"10m":1,"15m":1,"20m":1,"30m":1};return files[timeMap[duration]]||files[0];}function prescribe(){const rx=prescriptions[aim]||prescriptions.Calm;const file=getFile(rx.freq,time);setResult(`${time} ${aim} dose: ${rx.desc}`);if(mainRef.current&&file){mainRef.current.src=`${BASE_URL}${file}`;}}function playStack(){if(!isPlaying){const mainFile=getFile(stackMain,stackTime);const supportFile=stackSupport!=="none"?getFile(stackSupport,stackTime):null;if(mainFile){mainRef.current.src=`${BASE_URL}${mainFile}`;mainRef.current.volume=mainVol;mainRef.current.play();}if(supportFile&&supportRef.current){supportRef.current.src=`${BASE_URL}${supportFile}`;supportRef.current.volume=supportVol;supportRef.current.play();}setIsPlaying(true);}else{mainRef.current.pause();if(supportRef.current)supportRef.current.pause();setIsPlaying(false);}}return(<div className="space-y-4"><h2 className="text-xl">Sound-icine: Freqyn's Forged Dose</h2><div className="flex gap-2 mb-4"><button onClick={()=>setMode("simple")} className={`px-3 py-1 rounded ${mode==="simple"?"bg-brand-pink":"bg-gray-700"}`}>Simple</button><button onClick={()=>setMode("stack")} className={`px-3 py-1 rounded ${mode==="stack"?"bg-brand-pink":"bg-gray-700"}`}>Stack Builder</button></div>{mode==="simple"&&(<div className="bg-gray-800 p-4 rounded space-y-4"><div className="flex gap-4 flex-wrap"><select value={time} onChange={e=>setTime(e.target.value)} className="bg-gray-700 p-2 rounded"><option>5m</option><option>10m</option><option>15m</option><option>20m</option></select><select value={aim} onChange={e=>setAim(e.target.value)} className="bg-gray-700 p-2 rounded"><option>Calm</option><option>Focus</option><option>Sleep</option><option>Healing</option></select><select value={center} onChange={e=>setCenter(e.target.value)} className="bg-gray-700 p-2 rounded"><option>Mind</option><option>Body</option><option>Spirit</option></select><button onClick={prescribe} className="bg-brand-pink px-4 py-2 rounded">Forge Dose</button></div>{result&&<div className="bg-gray-700 p-3 rounded">{result}</div>}<audio ref={mainRef} controls className="w-full"><source type="audio/mpeg"/>Your browser does not support audio.</audio></div>)}{mode==="stack"&&(<div className="bg-gray-800 p-4 rounded space-y-4"><h3 className="text-lg">Layer Builder</h3><div className="grid grid-cols-2 gap-4"><div><label className="block text-sm mb-1">Main Layer</label><select value={stackMain} onChange={e=>setStackMain(e.target.value)} className="w-full bg-gray-700 p-2 rounded"><option value="alpha">Alpha (Calm/Focus)</option><option value="beta">Beta (Focus/Productivity)</option><option value="theta">Theta (Release/Meditation)</option><option value="delta">Delta (Sleep/Recovery)</option><option value="gamma">Gamma (Insights)</option><option value="heart">Heart 639 Hz</option><option value="root">Root 396 Hz</option><option value="jupiter">Jupiter (Abundance)</option><option value="venus">Venus (Love/Creativity)</option><option value="schumann">Schumann 7.83 Hz</option></select><div className="mt-2"><label className="block text-sm">Volume: {Math.round(mainVol*100)}%</label><input type="range" min="0" max="1" step="0.1" value={mainVol} onChange={e=>setMainVol(parseFloat(e.target.value))} className="w-full"/></div></div><div><label className="block text-sm mb-1">Support Layer</label><select value={stackSupport} onChange={e=>setStackSupport(e.target.value)} className="w-full bg-gray-700 p-2 rounded"><option value="none">— none —</option><option value="alpha">Alpha</option><option value="theta">Theta</option><option value="delta">Delta</option><option value="heart">Heart 639 Hz</option><option value="root">Root 396 Hz</option><option value="schumann">Schumann 7.83 Hz</option></select>{stackSupport!=="none"&&(<div className="mt-2"><label className="block text-sm">Volume: {Math.round(supportVol*100)}%</label><input type="range" min="0" max="1" step="0.1" value={supportVol} onChange={e=>setSupportVol(parseFloat(e.target.value))} className="w-full"/></div>)}</div></div><div className="flex gap-4 items-center"><label>Duration</label><select value={stackTime} onChange={e=>setStackTime(e.target.value)} className="bg-gray-700 p-2 rounded"><option>5m</option><option>10m</option><option>15m</option><option>20m</option><option>30m</option></select><button onClick={playStack} className="bg-brand-pink px-4 py-2 rounded">{isPlaying?"Stop Stack":"Play Stack"}</button></div><div className="text-sm text-gray-400">Two-layer system with auto-balanced volumes for optimal frequency mixing.</div><audio ref={mainRef} className="hidden"/><audio ref={supportRef} className="hidden"/></div>)}</div>);}function Sensory({senseScores,setSenseScores}){const [feedback,setFeedback]=useState(false);const senses=["sound","touch","scent","taste","symbolic"];const suggested=Object.entries(senseScores).sort((a,b)=>b[1]-a[1]).slice(0,2);function submitFeedback(sense){setSenseScores(prev=>({...prev,[sense]:(prev[sense]||0)+1}));setFeedback(false);}return(<div className="space-y-4"><h2 className="text-xl">Sensory Practice</h2><div className="bg-gray-800 p-4 rounded"><h3>Suggested: {suggested.map(([s])=>s).join(", ")}</h3></div><div className="flex gap-2">{senses.map(s=><button key={s} className="px-3 py-1 bg-gray-700 rounded">{s}</button>)}</div><button onClick={()=>setFeedback(true)} className="bg-brand-pink px-4 py-2 rounded">Complete Session</button>{feedback&&(<div className="fixed inset-0 bg-black/50 flex items-center justify-center"><div className="bg-white text-black p-6 rounded"><h3>Which sense felt easiest?</h3><div className="flex gap-2 mt-2">{senses.map(s=><button key={s} onClick={()=>submitFeedback(s)} className="px-3 py-1 bg-gray-200 rounded">{s}</button>)}</div></div></div>)}</div>);}function Shortcuts(){const shortcuts=["Angry-clean for 2min","Hold ice cube, breathe 4/6","Sing chorus loudly","5-4-3-2-1 senses","Walk counting to 20"];return(<div className="space-y-4"><h2 className="text-xl">NeuroSpicy Shortcuts</h2>{shortcuts.map((s,i)=><div key={i} className="bg-gray-800 p-3 rounded flex gap-2"><input type="checkbox"/><span>{s}</span></div>)}</div>);}function Profile({nudges,setNudges}){return(<div className="space-y-4"><h2 className="text-xl">Profile</h2><div className="bg-gray-800 p-4 rounded"><label className="flex justify-between"><span>Sensory Nudges</span><button onClick={()=>setNudges(!nudges)} className={`px-3 py-1 rounded ${nudges?"bg-green-500":"bg-gray-600"}`}>{nudges?"On":"Off"}</button></label></div></div>);}ReactDOM.render(<App/>,document.getElementById('root'));</script></body></html>
